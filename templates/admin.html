

<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
  <span class="navbar-brand">Admin Dashboard</span>
  <a href="/admin/logout" class="btn btn-sm btn-outline-light">Logout</a>
</nav>

<div class="container mt-4">

  <!-- Filters -->
  <form class="row g-2 mb-3">
    <div class="col-md-5">
      <input name="search" value="{{ search }}" class="form-control" placeholder="Search review text">
    </div>

    <div class="col-md-3">
      <select name="rating" class="form-select">
        <option value="">All Ratings</option>
        {% for i in range(1,6) %}
        <option value="{{ i }}" {% if rating == i|string %}selected{% endif %}>
          {{ i }} ⭐
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-2">
      <button class="btn btn-primary w-100">Filter</button>
    </div>
  </form>

  <!-- Table -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Rating</th>
            <th>Review</th>
            <th>AI Response</th>
            <th>Summary</th>
            <th>Action</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          {% for r in reviews %}
          <tr>
            <td>{{ r.rating }} ⭐</td>
            <td>{{ r.review }}</td>
            <td>{{ r.ai_response }}</td>
            <td><span class="badge bg-info">{{ r.summary }}</span></td>
            <td>{{ r.action }}</td>
            <td>{{ r.created_at }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <nav class="mt-3">
    <ul class="pagination">
      {% if page > 1 %}
      <li class="page-item">
        <a class="page-link" href="?page={{ page-1 }}&search={{ search }}&rating={{ rating }}">Previous</a>
      </li>
      {% endif %}
      <li class="page-item active">
        <span class="page-link">{{ page }}</span>
      </li>
      <li class="page-item">
        <a class="page-link" href="?page={{ page+1 }}&search={{ search }}&rating={{ rating }}">Next</a>
      </li>
    </ul>
  </nav>

</div>

</body>
</html>
