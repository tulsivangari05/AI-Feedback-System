<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Review</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    min-height: 100vh;
    background:
      linear-gradient(rgba(122, 117, 117, 0.4), rgba(123, 119, 119, 0.4)),
      url("/static/images/image.png") no-repeat center center fixed;
    background-size: cover;
  }

  .card {
    background-color: rgba(255, 255, 255, 0.95);
  }
</style>


</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="width: 420px;">

    <h4 class="text-center mb-4">Leave a Review</h4>

    <!-- Rating -->
    <div class="mb-3">
      <label class="form-label fw-bold">Rating</label>
      <select id="rating" class="form-select">
        <option value="">Select rating</option>
        <option value="1">⭐ </option>
        <option value="2">⭐⭐ </option>
        <option value="3">⭐⭐⭐ </option>
        <option value="4">⭐⭐⭐⭐ </option>
        <option value="5">⭐⭐⭐⭐⭐ </option>
      </select>
    </div>

    <!-- Review -->
    <div class="mb-3">
      <label class="form-label fw-bold">Review</label>
      <textarea
        id="review"
        rows="3"
        class="form-control"
        placeholder="Share your experience..."
      ></textarea>
    </div>

    <!-- Submit -->
    <button onclick="submitReview()" class="btn btn-primary w-100">
      Submit Review
    </button>

    <!-- Loading -->
    <div id="loading" class="text-center text-muted mt-3 d-none">
      Processing...
    </div>

    <!-- Result -->
    <div id="result" class="alert mt-3 d-none"></div>

    <!-- Optional AI Response -->
    <div id="ai_response" class="alert alert-info mt-2 d-none"></div>

  </div>
</div>

<script>
  async function submitReview() {
    const rating = Number(document.getElementById("rating").value);
    const review = document.getElementById("review").value;

    const resultBox = document.getElementById("result");
    const loading = document.getElementById("loading");
    const aiBox = document.getElementById("ai_response");

    resultBox.classList.add("d-none");
    aiBox.classList.add("d-none");
    loading.classList.remove("d-none");

    try {
      const res = await fetch("/api/submit-review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating, review })
      });

      const data = await res.json();
      loading.classList.add("d-none");

      if (data.error) {
        resultBox.className = "alert alert-danger mt-3";
        resultBox.innerText = data.error;
        resultBox.classList.remove("d-none");
      } else {
        // Show a "Submitted" message
        resultBox.className = "alert alert-success mt-3";
        resultBox.innerText = "✅ Submitted your review!";
        resultBox.classList.remove("d-none");

        // Optional: show AI response below
        if (data.ai_response) {
          aiBox.innerText = "AI Response: " + data.ai_response;
          aiBox.classList.remove("d-none");
        }

        // Clear form
        document.getElementById("rating").value = "";
        document.getElementById("review").value = "";
      }
    } catch (err) {
      loading.classList.add("d-none");
      resultBox.className = "alert alert-danger mt-3";
      resultBox.innerText = "⚠️ Something went wrong!";
      resultBox.classList.remove("d-none");
    }
  }
</script>

</body>
</html>
